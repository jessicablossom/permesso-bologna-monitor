name: Permesso Bologna Monitor

on:
  schedule:
    # GitHub schedule can be delayed or skipped. Multiple UTC slots around
    # 09:00 Europe/Rome increase the chance that one run fires each day.
    - cron: "0 6,7,8,9,10,11 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-check]

concurrency:
  group: permesso-bologna-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Rome date
        id: rome_date
        run: echo "today=$(TZ=Europe/Rome date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore daily lock
        if: github.event_name == 'schedule'
        id: daily_lock
        uses: actions/cache@v4
        with:
          path: /tmp/permesso-daily-lock
          key: permesso-monitor-${{ steps.rome_date.outputs.today }}

      - name: Decide whether to run check
        id: should_run
        env:
          EVENT_NAME: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.daily_lock.outputs.cache-hit }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CACHE_HIT" = "true" ]; then
            echo "Daily check already completed for $(TZ=Europe/Rome date +%Y-%m-%d) (Europe/Rome)."
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.should_run.outputs.value == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.should_run.outputs.value == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.should_run.outputs.value == 'true'
        run: python -m unittest discover -s tests -v

      - name: Validate secrets
        if: steps.should_run.outputs.value == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
        run: |
          missing=()
          [ -z "$SMTP_USER" ] && missing+=("SMTP_USER")
          [ -z "$SMTP_PASSWORD" ] && missing+=("SMTP_PASSWORD")
          [ -z "$QUESTURA_PRACTICE_CODE" ] && missing+=("QUESTURA_PRACTICE_CODE")
          [ -z "$QUESTURA_BIRTH_DATE" ] && missing+=("QUESTURA_BIRTH_DATE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check Questura Bologna
        if: steps.should_run.outputs.value == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
          QUESTURA_URL: ${{ vars.QUESTURA_URL }}
          TIMEZONE: Europe/Rome
        run: python -m permesso_bologna_monitor

      - name: Save daily lock
        if: github.event_name == 'schedule' && steps.should_run.outputs.value == 'true'
        run: mkdir -p /tmp/permesso-daily-lock && date -u > /tmp/permesso-daily-lock/ran-at
