name: Permesso Bologna Monitor

on:
  schedule:
    # GitHub cron uses UTC. 06:00/07:00 UTC cover 08:00 in Rome
    # during daylight saving time and standard time; the job gates below.
    - cron: "0 6,7 * * *"
  workflow_dispatch:

concurrency:
  group: permesso-bologna-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Confirm scheduled time
        id: schedule_gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_hour="$(TZ=Europe/Rome date +%H)"
          if [ "$current_hour" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run: current time in Rome is ${current_hour}:00."
          fi

      - name: Validate secrets
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
        run: |
          missing=()
          [ -z "$SMTP_USER" ] && missing+=("SMTP_USER")
          [ -z "$SMTP_PASSWORD" ] && missing+=("SMTP_PASSWORD")
          [ -z "$QUESTURA_PRACTICE_CODE" ] && missing+=("QUESTURA_PRACTICE_CODE")
          [ -z "$QUESTURA_BIRTH_DATE" ] && missing+=("QUESTURA_BIRTH_DATE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check Questura Bologna
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
          QUESTURA_URL: ${{ vars.QUESTURA_URL }}
          TIMEZONE: Europe/Rome
        run: python -m permesso_bologna_monitor
