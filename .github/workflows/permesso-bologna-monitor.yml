name: Permesso Bologna Monitor

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: Europe/Rome
  workflow_dispatch:

concurrency:
  group: permesso-bologna-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
        run: |
          missing=()
          [ -z "$SMTP_USER" ] && missing+=("SMTP_USER")
          [ -z "$SMTP_PASSWORD" ] && missing+=("SMTP_PASSWORD")
          [ -z "$QUESTURA_PRACTICE_CODE" ] && missing+=("QUESTURA_PRACTICE_CODE")
          [ -z "$QUESTURA_BIRTH_DATE" ] && missing+=("QUESTURA_BIRTH_DATE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check Questura Bologna
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          QUESTURA_PRACTICE_CODE: ${{ secrets.QUESTURA_PRACTICE_CODE }}
          QUESTURA_BIRTH_DATE: ${{ secrets.QUESTURA_BIRTH_DATE }}
          QUESTURA_URL: ${{ vars.QUESTURA_URL }}
          TIMEZONE: Europe/Rome
        run: python -m permesso_bologna_monitor
